spring.application.name=pos-inmueble

# PORT
server.port=3333

# DATABASE CONFIG
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inmueble_mc}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
database.name=db_car_rentals

spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS
cors.allowed.origins=http://localhost:3000,https://frontend-sca-manager.vercel.app,http://localhost:3001,http://localhost:3002,http://localhost:3003

# HABILITA EL SERVIDOR EUREKA
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# CREDENCIALES DEL API GATEWAY
